name: Documentation Size Check

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - '.cursor/rules/*.md*'
      - 'CLAUDE.md'
      - 'mvp_site/tests/test_documentation_performance.py'
      - 'mvp_site/monitor_doc_sizes.sh'
  push:
    branches:
      - main
    paths:
      - '.cursor/rules/*.md*'
      - 'CLAUDE.md'
      - 'mvp_site/tests/test_documentation_performance.py'
      - 'mvp_site/monitor_doc_sizes.sh'

jobs:
  doc-size-check:
    # Draft PRs skip this check (CI capacity hardening); push to
    # main is unaffected since draft is only defined on pull_request events.
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.event.pull_request.draft == false)
    # ubuntu-latest ($USER-oud/LANE-D): pure Python (test_documentation_performance.py
    # + monitor_doc_sizes.sh), zero self-hosted-only dependency. The former
    # retry-self-hosted job (which duplicated this exact work on ubuntu-latest
    # as a fallback) is now redundant and removed — see PR body.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
        persist-credentials: false


    - name: Set up Python
      if: runner.os == 'Linux'
      uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c  # v5.0.0
      with:
        python-version: '3.11'

    - name: Run documentation checks
      run: |
          set -euo pipefail
          python3 mvp_site/tests/test_documentation_performance.py
          chmod +x mvp_site/monitor_doc_sizes.sh
          ./mvp_site/monitor_doc_sizes.sh

    - name: Comment PR if files too large
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '⚠️ **Documentation Size Warning**\n\nSome documentation files exceed recommended size limits and may cause API timeouts.\n\nPlease run `python3 mvp_site/tests/test_documentation_performance.py` locally to see which files need reduction.'
          })
