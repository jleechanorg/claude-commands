        if [ "${{ github.event_name }}" = "pull_request" ]; then
          while read -r key; do
            git config --global --unset-all "$key" || true
          done < <(git config --global --name-only --get-regexp '^url\\..*\\.insteadOf$' 2>/dev/null || true)
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git check-ref-format --branch "$PR_HEAD_REF"
          git fetch origin "+refs/heads/${PR_HEAD_REF}:refs/remotes/origin/${PR_HEAD_REF}" --depth=1
          git checkout --force "$PR_HEAD_SHA"
          git sparse-checkout disable 2>/dev/null || true
          git config --unset core.sparseCheckout 2>/dev/null || true
          git reset --hard "$PR_HEAD_SHA"
        fi
        test -f scripts/ci/runner_preflight.sh
        test -f scripts/runner_health_score.py

    - name: Runner Preflight & Health Score check
      id: preflight
      run: |
        bash scripts/ci/runner_preflight.sh
        # Check runner health score; fail if quarantined
        python3 scripts/runner_health_score.py --runner "${{ runner.name }}" --threshold 10 check

    - name: Set up Node.js 20
      uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8  # v4.0.2
      with:
        node-version: '20'

    - name: Run core-mvp-1 tests (self-hosted)
      run: |
        set -euo pipefail
        source scripts/venv_utils.sh
        ensure_venv
        ensure_requirements_installed
        rm -rf mvp_site/test-results 2>/dev/null || true
        SHARD_DISPLAY=$((0 + 1))
        echo "🧩 Running Shard ${SHARD_DISPLAY} of 3 (core-mvp-1)"
        chmod +x run_tests.sh
        ./run_tests.sh --test-dirs=mvp_site --parallel --exclude-integration --exclude-mcp --include-end2end
        echo "🧪 Running frontend_v1 JS unit tests"
        # Source the shared ladder — kept in sync with mvp_site/tests/_node_path.py
        # so the workflow surface and the pytest surface resolve Node the same way.
        source scripts/node_utils.sh
        resolve_node_bin
        if [ -z "$NODE_BIN" ]; then
          echo "::warning::Node not found; skipping JS unit tests on this runner"
        else
          echo "Using node: $NODE_BIN ($($NODE_BIN --version))"
          "$NODE_BIN" --test mvp_site/frontend_v1/tests/*.test.js
        fi
      env:
        TESTING: "true"
        TESTING_AUTH_BYPASS: "true"
        MOCK_SERVICES_MODE: "true"
        FAST_TESTS: "1"
        GEMINI_API_KEY: "test-ci-key-only"
        CEREBRAS_API_KEY: "test-ci-key-only"
        OPENROUTER_API_KEY: "test-ci-key-only"
        TEST_GEMINI_API_KEY: "test-ci-key-only"
        GOOGLE_APPLICATION_CREDENTIALS: "/dev/null"
        WORLDAI_GOOGLE_APPLICATION_CREDENTIALS: "/dev/null"
        WORLDAI_DEV_MODE: "true"
        ENABLE_SEMANTIC_ROUTING: "false"
        ENABLE_BROWSER_TESTS: "0"
        ENABLE_BUILD_TESTS: "0"
        ENABLE_NETWORK_TESTS: "0"
        GITHUB_ACTIONS: "true"
        TEST_SUITE_TIMEOUT: "1800"
        TEST_MAX_WORKERS: 1
        TEST_SHARD_TOTAL: "3"
        TEST_SHARD_INDEX: "0"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
      continue-on-error: true
      with:
        name: mvp-shard1-test-results
        path: mvp_site/test-results/
        retention-days: 7
        if-no-files-found: ignore

    - name: Update health score on failure
      if: failure() && steps.preflight.outcome == 'failure'
