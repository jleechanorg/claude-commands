name: Workflow Discipline Lint

# FIXPLAN §4.4 class-level fix (docs/FIXPLAN-gh-actions-systemic-20260707.md,
# ez-gh-actions repo): checks every .github/workflows/*.yml for three
# structural gaps that each independently caused self-hosted queue waste
# this mission diagnosed — see scripts/lint_workflow_discipline.py for the
# full rule descriptions:
#   R1 — self-hosted job missing timeout-minutes (any hang holds a slot for
#        GitHub's 360min default)
#   R2 — push:main/dev trigger with no paths: filter (unfiltered pushes
#        multiply every structural inefficiency on every merge)
#   R3 — issue_comment workflow with github.ref-keyed concurrency (constant
#        across all PRs -> cross-PR cancellation, proven live 2026-07-07)
#
# Ratchet semantics: violations in scripts/workflow_lint_grandfather.yml are
# warn-only (pre-existing debt); anything else is a new violation and fails
# the job. See the grandfather file's own header for how to ratchet debt
# down over time. Runs on ubuntu-latest — this is a pure YAML/text check,
# no self-hosted tooling required.
#
# Consolidated 2026-07 with the former "Runner Checkout Lint" workflow to
# halve checkout/setup overhead and check-run noise: both linters are pure
# YAML/text checks over .github/workflows/**, so they now run as sequential
# steps in a single job instead of two separate workflow runs. The second
# lint step below catches self-hosted runner workflows that reference repo
# files without an actions/checkout step — the root cause of Gate-6b's
# non-deterministic fail-closed on stale workspace refs (fixed in PR #7578).

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/check_runner_checkout.sh"
      - "scripts/lint_workflow_discipline.py"
      - "scripts/workflow_lint_grandfather.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/check_runner_checkout.sh"
      - "scripts/lint_workflow_discipline.py"
      - "scripts/workflow_lint_grandfather.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  lint:
    name: Workflow discipline (timeout-minutes / paths filter / concurrency key / checkout presence)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Run workflow discipline lint
        run: python3 scripts/lint_workflow_discipline.py

      - name: Run checkout linter
        if: always()
        run: |
          chmod +x .github/scripts/check_runner_checkout.sh
          bash .github/scripts/check_runner_checkout.sh .github/workflows
