<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1170" viewBox="0 0 1400 1170" role="img" aria-labelledby="title desc">
<title id="title">User, dot, Hermes, and parallel cmux coding sessions</title>
<desc id="desc">The user gives goals and decisions to dot and receives results and blockers. dot remains the primary coordinator. A separate dot coordinator sends periodic reminders. dot can directly drive an existing cmux coding session or explicitly delegate another task to Hermes. Each task has one driver and one writer; independent tasks and read-only review run in parallel. Beads is the shared task and knowledge-coordination record. dot, Hermes, and coding agents read and update owners, state, dependencies, decisions, and evidence links. All lanes return exact-commit evidence to Beads. dot polls that evidence, reconciles review, and follows through to the requested endpoint. Merge or deployment requires authorization, current-head checks, no active holds, and one integration owner. These are operating rules, not a claim of automated enforcement.</desc>
